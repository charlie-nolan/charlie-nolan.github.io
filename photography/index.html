<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}:root{--bg:#eef0f1;--paper:#fbfcfc;--fg:#141b22;--muted:#55606b;--rule:#cfd5da;--accent:#2453c7;--tag:#b4530f;
--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--paper:#182027;--fg:#e8ecef;--muted:#9aa6b1;--rule:#2c3640;--accent:#7fa4ff;--tag:#f0a060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161b;--paper:#182027;--fg:#e8ecef;--muted:#9aa6b1;--rule:#2c3640;--accent:#7fa4ff;--tag:#f0a060;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;letter-spacing:-.02em}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:8px 20px;flex-wrap:wrap;padding-block:20px}
.name{font-family:var(--display);font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--fg)}
.label{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{display:grid;gap:28px;padding-block:24px 56px}
.intro{display:grid;gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-family:var(--mono);font-size:.8rem;background:var(--paper);color:var(--fg);border:1px solid var(--rule);padding:4px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.group{display:grid;gap:12px}.group h2{font-size:1.5rem;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{display:grid;gap:8px;align-content:start;padding:16px;background:var(--paper);border:1px solid var(--rule);text-decoration:none;color:var(--fg);min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{font-size:1.2rem;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:.94rem}
.status{justify-self:start;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tag);border:1px solid currentColor;padding:1px 7px}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.note{display:grid;gap:18px;max-width:68ch}
.summary{margin:0;font-size:1.1rem}
.prose h2{font-size:1.35rem;font-weight:800;margin:1.4em 0 .4em}
.prose p,.prose ul{margin:0 0 .8em}
.prose a{word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.prose figure{margin:0 0 1em}.prose figure img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--paper)}.prose figcaption{font-size:.88rem;color:var(--muted);margin-top:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px;margin:0 0 1em;align-items:start}.gallery figure{margin:0}
.note:has(.gallery){max-width:none}.note:has(.gallery) .prose p{max-width:68ch}
.photos{columns:3 260px;column-gap:14px}.photos .photo{break-inside:avoid;margin:0 0 14px;display:grid;gap:6px}
.photos img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--paper)}
.photo figcaption{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;color:var(--muted)}.photo time{font-family:var(--mono);font-size:.74rem}
</style></head><body>
<header><div class="wrap"><a class="name" href="../">Charlie Nolan</a><a href="../interests/">All interests</a></div></header>
<main class="wrap">
<div class="intro"><h1>Photography</h1><p>Things I&#x27;ve pointed a camera at.</p></div><div class="photos"><figure class="photo"><a href="img/2022-08-06-spider-meadow.jpg"><img src="img/2022-08-06-spider-meadow-sm.jpg" width="525" height="700" alt="Spider Meadow" loading="lazy"></a><figcaption><span>Spider Meadow</span><time>2022-08-06</time></figcaption></figure></div>
</main>
</body></html>
