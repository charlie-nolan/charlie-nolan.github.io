<title>Charlie Nolan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Charlie Nolan: mechanic in Shoreline, WA, and builder of open-source car diagnostic tools.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a maker's spec sheet. Left-aligned single column, each project reads like a datasheet entry
     with a photo and a short table of real specs. Accent is anodized-aluminum blue, one warm tag color for status. */
  :root {
    --bg: #eef0f1;
    --paper: #fbfcfc;
    --fg: #141b22;
    --muted: #55606b;
    --rule: #cfd5da;
    --accent: #2453c7;
    --accent-soft: #dfe7fa;
    --tag: #b4530f;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161b; --paper: #182027; --fg: #e8ecef; --muted: #9aa6b1; --rule: #2c3640;
      --accent: #7fa4ff; --accent-soft: #1f2c4a; --tag: #f0a060; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161b; --paper: #182027; --fg: #e8ecef; --muted: #9aa6b1; --rule: #2c3640;
    --accent: #7fa4ff; --accent-soft: #1f2c4a; --tag: #f0a060; color-scheme: dark;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
  .wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { font-family: var(--display); line-height: 1.05; margin: 0; text-wrap: balance; }
  h2 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -.01em; }
  h3 { font-size: 1.5rem; font-weight: 800; }
  p { margin: 0; max-width: 62ch; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .label { font-family: var(--mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  section { padding-block: 48px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }

  /* header */
  header .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 20px; flex-wrap: wrap; padding-block: 20px; }
  .name { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-decoration: none; color: var(--fg); }
  nav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .95rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--accent); }

  /* hero */
  .hero { border-top: 0; padding-block: 32px 48px; gap: 18px; }
  .hero h1 { font-size: clamp(2.5rem, 8vw, 4.4rem); font-weight: 800; letter-spacing: -.02em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .lede { font-size: 1.2rem; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .facts li { font-family: var(--mono); font-size: .82rem; background: var(--paper); border: 1px solid var(--rule); padding: 4px 10px; }

  /* projects: datasheet entries */
  .project { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 20px; }
  .project > * { min-width: 0; }
  .project .shot { display: grid; gap: 8px; }
  .project img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); background: var(--bg); }
  .project .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .project .thumbs img { aspect-ratio: 4 / 3; object-fit: cover; }
  .project .copy { display: grid; gap: 14px; align-content: start; }
  .status { justify-self: start; font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tag); border: 1px solid currentColor; padding: 2px 8px; }
  .spec { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .spec th, .spec td { text-align: left; padding: 7px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  .spec th { font-family: var(--mono); font-weight: 400; font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 38%; padding-right: 12px; }
  .spec td { font-variant-numeric: tabular-nums; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 600; }
  @media (max-width: 700px) { .project { grid-template-columns: 1fr; } }

  /* github */
  .repos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .repo { display: grid; gap: 6px; padding: 16px; border: 1px solid var(--rule); background: var(--paper); text-decoration: none; color: var(--fg); }
  .repo:hover { border-color: var(--accent); }
  .repo b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
  .repo span { color: var(--muted); font-size: .93rem; }
  @media (max-width: 560px) { .repos { grid-template-columns: 1fr; } }

  /* galleries */
  .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .gallery figure { margin: 0; display: grid; gap: 6px; }
  .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .gallery figcaption { font-size: .85rem; color: var(--muted); }
  @media (max-width: 560px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .empty { border: 1px dashed var(--rule); padding: 28px 20px; color: var(--muted); display: grid; gap: 6px; }
  .empty b { color: var(--fg); font-weight: 600; }

  /* blog */
  .posts { display: grid; gap: 0; padding: 0; margin: 0; list-style: none; }
  .posts li { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--rule); }
  .posts time { font-family: var(--mono); font-size: .85rem; color: var(--muted); padding-top: 2px; }
  @media (max-width: 480px) { .posts li { grid-template-columns: 1fr; gap: 2px; } }

  /* mechanic band */
  .shop { background: var(--accent-soft); border: 1px solid var(--rule); padding: 24px; display: grid; gap: 12px; }
  .btn { justify-self: start; display: inline-block; background: var(--accent); color: var(--paper); font-weight: 600; padding: 10px 18px; text-decoration: none; }

  /* interests (generated from the Obsidian vault) */
  .icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
  .card { display: grid; gap: 8px; align-content: start; padding: 16px; background: var(--paper); border: 1px solid var(--rule); text-decoration: none; color: var(--fg); min-width: 0; }
  .card:hover { border-color: var(--accent); }
  .card h3 { font-size: 1.2rem; }
  .card p { color: var(--muted); font-size: .94rem; }
  .tagnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .tagnav a { font-family: var(--mono); font-size: .8rem; text-decoration: none; color: var(--fg); background: var(--paper); border: 1px solid var(--rule); padding: 4px 10px; }
  .tagnav a:hover { border-color: var(--accent); color: var(--accent); }
  .photostrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
  .photo { margin: 0; display: grid; gap: 6px; }
  .photo img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--rule); background: var(--paper); }
  .photo figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: .86rem; color: var(--muted); }
  .photo time { font-family: var(--mono); font-size: .74rem; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: .76rem; color: var(--muted); }
  #interests > a { font-weight: 600; }

  footer .wrap { padding-block: 28px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 20px; }
</style>
